[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ransomforensics"
version = "0.1.0"
description = "Ransomware encrypted-file forensics: family identification and keyless recovery of unencrypted regions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ransomware", "forensics", "incident-response", "recovery", "reverse-engineering"]
classifiers = [
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
ransomforensics = "ransomforensics.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
